<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxia de Flores Amarillas</title>
  <style>
    :root {
      --color-amarillo: #ffeb3b;
      --brillo-oro: #fbc02d;
    }
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
      color: #fff;
    }
    .stars {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0.6;
      animation: twinkle var(--duration) infinite ease-in-out;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }
    h1 {
      color: var(--color-amarillo);
      font-size: 2.2rem;
      text-transform: uppercase;
      text-shadow: 0 0 10px var(--brillo-oro), 0 0 20px var(--brillo-oro);
      margin-bottom: 10px;
      animation: pulse-glow 2s infinite alternate;
    }
    p {
      color: #fff9c4;
      font-size: 1.2rem;
      max-width: 600px;
      line-height: 1.5;
      text-shadow: 0 0 5px rgba(255,255,255,0.5);
    }
    @keyframes pulse-glow {
      from { text-shadow: 0 0 10px var(--brillo-oro), 0 0 20px var(--brillo-oro); }
      to { text-shadow: 0 0 20px var(--brillo-oro), 0 0 40px #ffee58, 0 0 10px #fff; }
    }
    .girasol {
      position: absolute;
      z-index: 5;
      pointer-events: none;
      font-size: 2rem;
      filter: drop-shadow(0 0 10px var(--brillo-oro));
      animation: galaxy-float 6s linear forwards;
    }
    @keyframes galaxy-float {
      0% { transform: translate(0, 110vh) rotate(0deg) scale(0.2); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translate(var(--tx), -10vh) rotate(360deg) scale(1.2); opacity: 0; }
    }
    .heart-shape {
      font-size: 4rem;
      margin-top: 20px;
      animation: float-heart 3s ease-in-out infinite alternate;
    }
    @keyframes float-heart {
      from { transform: translateY(0) scale(1); }
      to { transform: translateY(-10px) scale(1.1); }
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="container">
    <div class="heart-shape">💛</div>
    <h1>Galaxia de Flores Amarillas</h1>
    <p>Para iluminar tu día con la misma brillantez de mil estrellas. 🌻✨</p>
  </div>

  <script>
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 120; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.width = `${Math.random() * 3 + 1}px`;
      star.style.height = star.style.width;
      star.style.left = `${Math.random() * 100}%`;
      star.style.top = `${Math.random() * 100}%`;
      star.style.setProperty('--duration', `${Math.random() * 3 + 1}s`);
      starsContainer.appendChild(star);
    }

    function createFlower() {
      const flower = document.createElement('div');
      flower.className = 'girasol';
      flower.innerHTML = Math.random() > 0.3 ? '🌻' : '🌼';
      flower.style.left = `${Math.random() * 90 + 5}%`;
      flower.style.setProperty('--tx', `${(Math.random() - 0.5) * 200}px`);
      document.body.appendChild(flower);
      setTimeout(() => flower.remove(), 6000);
    }
    setInterval(createFlower, 400);
  </script>
</body>
</html>
