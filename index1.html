<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxia de Flores Amarillas</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #05020a;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }
    .text-overlay {
      position: absolute;
      bottom: 8%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      color: #fff;
      pointer-events: none;
      width: 90%;
    }
    .text-overlay h1 {
      font-size: 2rem;
      color: #ffeb3b;
      text-shadow: 0 0 10px #ffb300, 0 0 20px #ff8f00;
      margin: 0 0 8px 0;
      letter-spacing: 2px;
    }
    .text-overlay p {
      font-size: 1.1rem;
      color: #fff9c4;
      text-shadow: 0 0 8px rgba(255, 235, 59, 0.8);
      margin: 0;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="text-overlay">
    <h1>GALAXIA DE FLORES AMARILLAS</h1>
    <p>Para iluminar tu día con la misma brillantez de mil estrellas. 🌻✨</p>
  </div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x05020a, 0.0015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, -10, 35);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Textura brillante
    function createGlowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 64; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(32,32,0, 32,32,32);
      grad.addColorStop(0, 'rgba(255, 235, 59, 1)');
      grad.addColorStop(0.3, 'rgba(255, 179, 0, 0.8)');
      grad.addColorStop(0.8, 'rgba(255, 111, 0, 0.2)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0,0,64,64);
      return new THREE.CanvasTexture(canvas);
    }

    const glowTexture = createGlowTexture();

    // 1. Corazón de Partículas 3D
    const heartCount = 6000;
    const heartGeo = new THREE.BufferGeometry();
    const heartPos = new Float32Array(heartCount * 3);

    for(let i = 0; i < heartCount; i++) {
      let t = Math.PI * (Math.random() * 2 - 1);
      let u = Math.PI * (Math.random() * 2 - 1);
      
      // Ecuación paramétrica de corazón 3D
      let x = 16 * Math.pow(Math.sin(t), 3);
      let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
      let z = u * 4;

      let factor = 0.6 + Math.random() * 0.1;
      heartPos[i*3] = x * factor;
      heartPos[i*3+1] = y * factor;
      heartPos[i*3+2] = z * factor;
    }

    heartGeo.setAttribute('position', new THREE.BufferAttribute(heartPos, 3));
    const heartMat = new THREE.PointsMaterial({
      size: 0.8,
      map: glowTexture,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const heartMesh = new THREE.Points(heartGeo, heartMat);
    heartMesh.position.y = 4;
    scene.add(heartMesh);

    // 2. Galaxia de Polvo Estelar Dorado
    const starCount = 4000;
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(starCount * 3);

    for(let i=0; i<starCount; i++) {
      let r = 5 + Math.random() * 45;
      let theta = Math.random() * Math.PI * 2;
      let phi = (Math.random() - 0.5) * Math.PI;

      starPos[i*3] = r * Math.cos(theta) * Math.cos(phi);
      starPos[i*3+1] = r * Math.sin(phi);
      starPos[i*3+2] = r * Math.sin(theta) * Math.cos(phi);
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starMat = new THREE.PointsMaterial({
      size: 0.4,
      color: 0xffd54f,
      transparent: true,
      opacity: 0.7,
      blending: THREE.AdditiveBlending
    });
    const starMesh = new THREE.Points(starGeo, starMat);
    scene.add(starMesh);

    // Animación
    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      let elapsedTime = clock.getElapsedTime();

      heartMesh.rotation.y = elapsedTime * 0.4;
      heartMesh.position.y = 4 + Math.sin(elapsedTime * 1.5) * 0.5;

      starMesh.rotation.y = elapsedTime * 0.05;
      starMesh.rotation.x = Math.sin(elapsedTime * 0.03) * 0.1;

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
